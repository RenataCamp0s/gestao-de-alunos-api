name: Testes de API para gestão de alunos

on:
  workflow_dispatch:
  push:
    branches: 
    - testes-de-api

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      PORT: 3000
      BASE_URL: http://localhost:3000
      ADMIN_EMAIL: admin@escola.com
      ADMIN_SENHA: admin123

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Instalar dependências
        run: npm ci

      - name: Iniciar API
        run: |
          npm start > server.log 2>&1 &
          npx wait-on http://localhost:3000

      - name: Executar testes
        run: |
          mkdir -p reports
          npm test -- \
            --reporter mochawesome \
            --reporter-options reportDir=reports,reportFilename=mochawesome-report,quiet=false

      - name: Publicar relatório Mochawesome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-mochawesome
          path: reports
          if-no-files-found: error